<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFFFFF;--ink:#14151A;--ink-soft:#565A66;--ink-faint:#9096A3;--line:#ECEDF1;--line-2:#DEE0E6;--display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
  .blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blobs span{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(90px);opacity:.16;}
  .blobs .b1{background:#2AA6C7;top:-16vmax;left:-10vmax;animation:drift1 22s ease-in-out infinite}
  .blobs .b2{background:#F43F7A;top:-10vmax;right:-14vmax;animation:drift2 26s ease-in-out infinite}
  .blobs .b3{background:#16B364;bottom:-18vmax;left:8vmax;animation:drift3 30s ease-in-out infinite}
  .blobs .b4{background:#F59E0B;bottom:-16vmax;right:-8vmax;animation:drift4 24s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(8vmax,6vmax) scale(1.1)}}
  @keyframes drift2{50%{transform:translate(-6vmax,8vmax) scale(1.15)}}
  @keyframes drift3{50%{transform:translate(6vmax,-6vmax) scale(1.1)}}
  @keyframes drift4{50%{transform:translate(-8vmax,-4vmax) scale(1.12)}}
  #hub{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:60px 28px 80px;}
  .masthead{display:flex;flex-direction:column;gap:20px;margin-bottom:44px}
  .titlerow{display:flex;align-items:center;gap:16px}
  .chill{display:flex;align-items:center;gap:13px;flex-wrap:wrap;animation:cardin .6s cubic-bezier(.2,.7,.2,1) .15s both}
  .pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.01em;color:#fff;padding:8px 16px;border-radius:999px;white-space:nowrap;background:linear-gradient(100deg,#2AA6C7,#16B364,#F59E0B,#F43F7A,#2AA6C7);background-size:260% 100%;animation:sweep 7s linear infinite;box-shadow:0 8px 20px -8px rgba(20,21,26,.45)}
  .pill .ic{display:inline-block;animation:wobble 2.2s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}60%{transform:rotate(14deg)}}
  .chilltext{font-size:14.5px;color:var(--ink-soft);font-weight:500;letter-spacing:.005em}
  .coin{width:52px;height:52px;border-radius:14px;flex:0 0 auto;background:conic-gradient(from 0deg,#2AA6C7,#16B364,#F59E0B,#F43F7A,#2AA6C7);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px -8px rgba(20,21,26,.4);animation:spin 8s linear infinite, bob 3s ease-in-out infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{50%{margin-top:-6px}}
  .coin i{font-style:normal;display:block;animation:spin 8s linear infinite reverse}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6.5vw,56px);letter-spacing:-.02em;line-height:.95;background:linear-gradient(100deg,#2AA6C7,#16B364,#F59E0B,#F43F7A,#2AA6C7);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 7s linear infinite;}
  @keyframes sweep{to{background-position:260% 0}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
  .card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 0 20px;cursor:pointer;overflow:hidden;opacity:0;transform:translateY(14px);animation:cardin .5s cubic-bezier(.2,.7,.2,1) forwards;transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease, border-color .22s ease;}
  @keyframes cardin{to{opacity:1;transform:none}}
  .card:hover,.card:focus-visible{transform:translateY(-7px);border-color:transparent;box-shadow:0 22px 46px -18px var(--shadow,rgba(20,21,26,.4)), 0 0 0 1.5px var(--accent,#ddd);outline:none;}
  .motif{position:relative;height:104px;overflow:hidden;border-bottom:1px solid var(--line);background:var(--tint,#f7f8fa);}
  .card:hover .motif{filter:saturate(1.15)}
  .body{padding:18px 22px 0}
  .kicker{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .kicker span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .card h3{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin-bottom:8px}
  .card .desc{font-size:13px;line-height:1.55;color:var(--ink-soft)}
  .card .play{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:13px;font-weight:600;color:var(--accent);}
  .card .play .arr{transition:transform .2s cubic-bezier(.2,.7,.2,1)}
  .card:hover .play .arr{transform:translateX(5px)}
  .idx{position:absolute;top:12px;right:14px;z-index:3;font-family:var(--display);font-weight:700;font-size:12px;color:#fff;background:rgba(20,21,26,.28);border-radius:20px;padding:2px 9px;backdrop-filter:blur(3px)}
  .m-helpdesk .row{position:absolute;left:18px;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left}
  .m-helpdesk .r1{top:26px;width:76%;animation:sla 2.6s ease-in-out infinite}
  .m-helpdesk .r2{top:46px;width:58%;animation:sla 2.6s ease-in-out .55s infinite}
  .m-helpdesk .r3{top:66px;width:68%;animation:sla 2.6s ease-in-out 1.1s infinite}
  @keyframes sla{0%{transform:scaleX(1)}62%{transform:scaleX(.06)}66%{transform:scaleX(.06);opacity:.5}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1)}}
  .m-snake .seg{position:absolute;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:3px;background:var(--accent);animation:snmove 3s linear infinite}
  .m-snake .s0{animation-delay:0s} .m-snake .s1{animation-delay:.12s;opacity:.85}
  .m-snake .s2{animation-delay:.24s;opacity:.7} .m-snake .s3{animation-delay:.36s;opacity:.55}
  @keyframes snmove{0%{left:-18px}100%{left:calc(100% + 18px)}}
  .m-snake .food{position:absolute;top:50%;left:68%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 25%,transparent);animation:snfood 3s linear infinite}
  @keyframes snfood{0%,58%{transform:scale(1);opacity:1}64%{transform:scale(1.7);opacity:0}66%{opacity:0}100%{opacity:1}}
  .m-slicer .threat{position:absolute;font-size:22px;animation:slpop 2.2s ease-in-out infinite}
  .m-slicer .a{left:24%;top:20%} .m-slicer .b{left:58%;top:44%;animation-delay:.12s}
  @keyframes slpop{0%,44%{transform:scale(1) rotate(0);opacity:1}54%{transform:scale(1.4) rotate(22deg);opacity:0}56%{transform:scale(0);opacity:0}82%{opacity:0}100%{transform:scale(1);opacity:1}}
  .m-slicer .blade{position:absolute;left:-30%;width:160%;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 12px var(--accent);animation:slash 2.2s ease-in-out infinite}
  @keyframes slash{0%{top:120%;opacity:0}34%{opacity:1}52%{top:-20%;opacity:1}64%{opacity:0}100%{top:-20%;opacity:0}}
  .m-stack .blk{position:absolute;left:50%;height:15px;border-radius:3px;background:linear-gradient(var(--accent2),var(--accent))}
  .m-stack .base{bottom:16px;width:46px;margin-left:-23px}
  .m-stack .mid{bottom:31px;width:42px;margin-left:-21px;animation:stmid 2.8s ease-in-out infinite}
  .m-stack .top{bottom:46px;width:38px;margin-left:-19px;animation:sttop 2.8s ease-in-out infinite}
  @keyframes stmid{0%{transform:translateY(-64px);opacity:0}18%{opacity:1}30%{transform:translateY(0)}100%{transform:translateY(0);opacity:1}}
  @keyframes sttop{0%,34%{transform:translateY(-64px);opacity:0}42%{opacity:1}56%{transform:translateY(0)}62%{transform:translateY(-4px)}70%{transform:translateY(0)}100%{transform:translateY(0);opacity:1}}
  .runner-wrap{margin-top:26px;position:relative;overflow:hidden;background:linear-gradient(180deg,#FAF7FF,#FFFFFF);border:1px solid var(--line);border-radius:18px;padding:16px 18px 14px;animation:cardin .5s cubic-bezier(.2,.7,.2,1) .3s both;}
  .runner-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .runner-hi{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--ink-faint);font-weight:600;white-space:nowrap}
  .runner-hi b{color:#8B5CF6}
  #runner{display:block;width:100%;height:200px;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#FFFFFF,#FBFAFF);outline:none}
  #runner:focus-visible{box-shadow:0 0 0 2px #8B5CF6}
  .runner-hint{margin-top:9px;font-size:11.5px;color:var(--ink-faint);text-align:center;letter-spacing:.02em}
  #player{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#fff}
  #player.open{display:flex;animation:cardin .28s ease}
  .topbar{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding:13px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .back{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:#fff;border:1px solid var(--line-2);color:var(--ink);font-family:var(--display);font-weight:600;font-size:13px;padding:9px 16px;border-radius:10px;transition:background .16s,border-color .16s,transform .1s}
  .back:hover{background:#FAFAFB;border-color:var(--ink-faint)}
  .back:active{transform:scale(.97)}
  .nowplaying{display:flex;align-items:center;gap:12px}
  .nowplaying .dim{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .nowplaying .t{font-family:var(--display);font-weight:600;font-size:17px}
  #frameWrap{flex:1;position:relative;overflow:hidden;background:#060912}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-family:var(--display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;z-index:2;background:#fff}
  .loading.hide{display:none}
  .loading b{animation:bob 1s ease-in-out infinite;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;animation-iteration-count:1 !important}}
  @media (max-width:520px){#hub{padding:40px 16px 50px}.masthead{margin-bottom:30px;gap:16px}.chilltext{font-size:13px}.topbar{padding:11px 13px}.nowplaying .dim{display:none}}
</style>
</head>

  <script>
  /* ===== Shared leaderboard client (JSONBin.io) ===== */
  window.__LB = (function(){
    var BIN = "6a66eb86da38895dfe94af09";
    var KEY = "$2a$10$N1E/FtFjpajegtx0W33ZhuQRJEPzMukt8ZoGHosYnY91ADW/7EUCO";
    var API = "https://api.jsonbin.io/v3/b/" + BIN;
    var HDR = "X-Access-Key";
    var enabled = !!(BIN && KEY);
    var cache = {};
    function lget(id){ try{ return JSON.parse(localStorage.getItem("lb:"+id)||"[]"); }catch(e){ return []; } }
    function lset(id,b){ try{ localStorage.setItem("lb:"+id, JSON.stringify(b)); }catch(e){} }
    function norm(a){
      a = a ? (Array.isArray(a)? a : Object.keys(a).map(function(k){return a[k];})) : [];
      a = a.filter(function(e){ return e && typeof e.score==="number" && e.name; });
      var seen={}, u=[];
      a.forEach(function(e){ var sig=String(e.name)+"|"+e.score; if(!seen[sig]){ seen[sig]=1; u.push({name:String(e.name).slice(0,16), score:Math.floor(e.score)}); } });
      u.sort(function(x,y){ return y.score - x.score; });
      return u.slice(0,3);
    }
    function get(id){ return cache[id] ? cache[id] : lget(id); }
    function pull(cb){
      var h={"X-Bin-Meta":"false"}; h[HDR]=KEY;
      fetch(API+"/latest", {headers:h})
        .then(function(r){ return r.json(); })
        .then(function(d){ var o=(d&&d.record!==undefined)?d.record:d; if(!o||typeof o!=="object") o={}; cb&&cb(o); })
        .catch(function(){ cb&&cb(null); });
    }
    function refresh(id, cb){
      if(!enabled){ cache[id]=norm(lget(id)); cb&&cb(cache[id]); return; }
      pull(function(obj){
        if(obj){ Object.keys(obj).forEach(function(k){ cache[k]=norm(obj[k]); lset(k,cache[k]); }); }
        if(!cache[id]) cache[id]=norm(lget(id));
        cb&&cb(cache[id]);
      });
    }
    function set(id, b, cb){
      b = norm(b); cache[id]=b; lset(id,b);
      if(!enabled){ cb&&cb(b); return; }
      pull(function(obj){
        obj = (obj && typeof obj==="object") ? obj : {};
        obj[id] = norm((obj[id]||[]).concat(b));
        var h={"Content-Type":"application/json"}; h[HDR]=KEY;
        fetch(API, {method:"PUT", headers:h, body:JSON.stringify(obj)})
          .then(function(r){ return r.json(); })
          .then(function(){ cache[id]=norm(obj[id]); lset(id,cache[id]); cb&&cb(cache[id]); })
          .catch(function(){ cb&&cb(cache[id]); });
      });
    }
    return { get:get, refresh:refresh, set:set, enabled:enabled };
  })();
  </script>

function b64ToStr(b64){var bin=atob(b64), bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(bytes);}
function motifHTML(key){
  if(key==="helpdesk") return '<b class="row r1"></b><b class="row r2"></b><b class="row r3"></b>';
  if(key==="snake") return '<i class="seg s0"></i><i class="seg s1"></i><i class="seg s2"></i><i class="seg s3"></i><i class="food"></i>';
  if(key==="slicer") return '<span class="threat a">🦠</span><span class="threat b">🐛</span><span class="blade"></span>';
  if(key==="stack") return '<span class="blk base"></span><span class="blk mid"></span><span class="blk top"></span>';
  return "";
}
GAMES.forEach(function(g,i){
  var card=document.createElement("div");
  card.className="card m-"+g.key;
  card.tabIndex=0; card.setAttribute("role","button");
  card.style.setProperty("--accent",g.color);
  card.style.setProperty("--accent2",g.color2);
  card.style.setProperty("--tint",g.tint);
  card.style.setProperty("--shadow",g.glow);
  card.style.animationDelay=(0.06*i)+"s";
  var num=("0"+(i+1)).slice(-2);
  card.innerHTML='<span class="idx">'+num+'</span><div class="motif">'+motifHTML(g.key)+'</div><div class="body"><div class="kicker"><span class="dot"></span><span>'+g.sub+'</span></div><h3>'+g.title+'</h3><div class="desc">'+g.desc+'</div><div class="play">Play<span class="arr">&rarr;</span></div></div>';
  function launch(){ openGame(g); }
  card.addEventListener("click",launch);
  card.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); launch(); }});
  grid.appendChild(card);
});
function openGame(g){npTitle.textContent=g.title;loading.classList.remove("hide");player.classList.add("open");player.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";frame.onload=function(){loading.classList.add("hide");};frame.srcdoc=b64ToStr(g.data);}
function closeGame(){player.classList.remove("open");player.setAttribute("aria-hidden","true");document.body.style.overflow="";frame.srcdoc="";loading.classList.remove("hide");}
document.getElementById("backBtn").addEventListener("click",closeGame);
window.addEventListener("keydown",function(e){ if(e.key==="Escape"&&player.classList.contains("open")) closeGame(); });

<script>
/* ============ OFFLINE RUNNER — cute IT robot, zero network calls ============ */
(function(){
  var cv=document.getElementById("runner"); if(!cv) return;
  var ctx=cv.getContext("2d");
  var DPR=Math.min(2,window.devicePixelRatio||1);
  var CSSH=200, cssW=300, groundY=CSSH-30;
  function resize(){ cssW=cv.clientWidth||cv.parentElement.clientWidth||300; cv.width=Math.round(cssW*DPR); cv.height=Math.round(CSSH*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener("resize",resize);
  var ACC="#8B5CF6", ACC2="#B79BFF", BUG="#EF4444", INK="#14151A", FAINT="#B9BDC9";
  var HIKEY="itArcadeRunnerHI", hi=0;
  try{ hi=parseInt(localStorage.getItem(HIKEY)||"0",10)||0; }catch(e){}
  var runHi=document.getElementById("runHi"), runScore=document.getElementById("runScore"), runHint=document.getElementById("runHint");
  function pad(n){ return ("00000"+Math.floor(n)).slice(-5); }
  runHi.textContent=pad(hi);
  var JUMP=-10.6, GRAV=0.58, STAND=34, DUCK=20, HW=30;
  var hero, obs, speed, score, state, frame, distSpawn, spawnGap, hover=false, flashT=0, flashMsg="";
  function reset(){ hero={x:48, y:groundY-STAND, vy:0, onGround:true, duck:false}; obs=[]; speed=5.0; score=0; frame=0; distSpawn=0; spawnGap=280; flashT=0; }
  reset(); state="idle";
  function startRun(){ if(state==="idle"||state==="over"){ reset(); state="run"; runHint.style.opacity="0"; } }
  function flap(){ if(state==="idle"){ startRun(); return; } if(state==="over"){ startRun(); return; } if(hero.onGround){ hero.vy=JUMP; hero.onGround=false; } }
  function gameOver(){ state="over"; if(score>hi){ hi=Math.floor(score); try{localStorage.setItem(HIKEY,String(hi));}catch(e){} runHi.textContent=pad(hi); flashMsg="NEW HIGH SCORE!"; } else flashMsg="GAME OVER"; flashT=1; runHint.style.opacity="1"; runHint.textContent="Space / tap to retry"; }
  cv.addEventListener("pointerdown",function(){ cv.focus(); if(state==="run"){flap();} else {startRun();} });
  cv.addEventListener("mouseenter",function(){ hover=true; });
  cv.addEventListener("mouseleave",function(){ hover=false; hero.duck=false; });
  window.addEventListener("keydown",function(e){ var active=(document.activeElement===cv)||hover; if(!active) return; if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){ e.preventDefault(); flap(); } else if(e.key==="ArrowDown"||e.key==="s"||e.key==="S"){ e.preventDefault(); if(state==="run") hero.duck=true; } });
  window.addEventListener("keyup",function(e){ if(e.key==="ArrowDown"||e.key==="s"||e.key==="S") hero.duck=false; });
  function spawn(){ var air=score>160&&Math.random()<0.34; if(air){ obs.push({type:"air",x:cssW+20,w:34,h:26,y:groundY-56}); } else { var w=18+Math.random()*14; obs.push({type:"bug",x:cssW+20,w:w,h:24,y:groundY-24}); } }
  function update(){ frame++; if(state==="run"){ speed+=0.0016; score+=speed*0.03; var curH=(hero.duck&&hero.onGround)?DUCK:STAND; hero.vy+=GRAV; hero.y+=hero.vy; var floor=groundY-curH; if(hero.y>=floor){ hero.y=floor; hero.vy=0; hero.onGround=true; } else hero.onGround=false; distSpawn+=speed; if(distSpawn>=spawnGap){ spawn(); distSpawn=0; spawnGap=Math.max(150,240+Math.random()*150-speed*6); } var hb={x:hero.x+3,y:hero.y+2,w:HW-6,h:curH-4}; for(var i=obs.length-1;i>=0;i--){ var o=obs[i]; o.x-=speed; if(o.x+o.w<-10){ obs.splice(i,1); continue; } if(hb.x<o.x+o.w&&hb.x+hb.w>o.x&&hb.y<o.y+o.h&&hb.y+hb.h>o.y){ gameOver(); } } runScore.textContent=pad(score); } else if(state==="idle"){ hero.y=groundY-STAND+Math.sin(frame*0.08)*2; } if(flashT>0) flashT-=0.02; }
  function drawGround(){ ctx.strokeStyle="#E4E1EC"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,groundY+0.5); ctx.lineTo(cssW,groundY+0.5); ctx.stroke(); ctx.strokeStyle="#EBE7F4"; ctx.lineWidth=2; var off=(frame*speed)%34; for(var x=-off;x<cssW;x+=34){ ctx.beginPath(); ctx.moveTo(x,groundY+8); ctx.lineTo(x+14,groundY+8); ctx.stroke(); } }
  function drawHero(){ var curH=(hero.duck&&hero.onGround)?DUCK:STAND; var x=hero.x,y=hero.y,w=HW,h=curH; ctx.save(); ctx.fillStyle=ACC; if(state==="run"&&hero.onGround){ var step=Math.floor(frame/5)%2; ctx.fillRect(x+6,y+h,6,6*(step?1:0.4)); ctx.fillRect(x+w-12,y+h,6,6*(step?0.4:1)); } else { ctx.fillRect(x+6,y+h,6,4); ctx.fillRect(x+w-12,y+h,6,4); } var g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,ACC2); g.addColorStop(1,ACC); ctx.fillStyle=g; rr(x,y,w,h,8); ctx.fill(); ctx.fillStyle="#0E0B1A"; rr(x+5,y+(hero.duck?4:7),w-10,(hero.duck?9:12),4); ctx.fill(); var blink=(frame%150)<6; ctx.fillStyle="#fff"; var ey=y+(hero.duck?8:12); if(!blink){ ctx.beginPath(); ctx.arc(x+11,ey,2.6,0,6.283); ctx.fill(); ctx.beginPath(); ctx.arc(x+w-11,ey,2.6,0,6.283); ctx.fill(); ctx.fillStyle=ACC; ctx.beginPath(); ctx.arc(x+12,ey,1.1,0,6.283); ctx.fill(); ctx.beginPath(); ctx.arc(x+w-10,ey,1.1,0,6.283); ctx.fill(); } else { ctx.fillRect(x+8,ey,6,1.6); ctx.fillRect(x+w-14,ey,6,1.6); } if(!hero.duck){ ctx.strokeStyle=ACC; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y-8); ctx.stroke(); ctx.fillStyle=BUG; ctx.beginPath(); ctx.arc(x+w/2,y-10,3,0,6.283); ctx.fill(); } ctx.restore(); }
  function drawBug(o){ var cx=o.x+o.w/2, cy=o.y+o.h/2; ctx.save(); ctx.strokeStyle="#B91C1C"; ctx.lineWidth=1.8; for(var s=-1;s<=1;s++){ ctx.beginPath(); ctx.moveTo(cx-o.w*0.32,cy+s*4); ctx.lineTo(cx-o.w*0.5,cy+s*6+2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx+o.w*0.32,cy+s*4); ctx.lineTo(cx+o.w*0.5,cy+s*6+2); ctx.stroke(); } var g=ctx.createLinearGradient(cx,o.y,cx,o.y+o.h); g.addColorStop(0,"#F87171"); g.addColorStop(1,BUG); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,o.w*0.5,o.h*0.5,0,0,6.283); ctx.fill(); ctx.strokeStyle="#B91C1C"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(cx,o.y+2); ctx.lineTo(cx,o.y+o.h-2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx-4,o.y+2); ctx.lineTo(cx-8,o.y-4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx+4,o.y+2); ctx.lineTo(cx+8,o.y-4); ctx.stroke(); ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx-3,cy-1,1.6,0,6.283); ctx.fill(); ctx.beginPath(); ctx.arc(cx+3,cy-1,1.6,0,6.283); ctx.fill(); ctx.restore(); }
  function drawEnvelope(o){ ctx.save(); var g=ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h); g.addColorStop(0,"#fff"); g.addColorStop(1,"#F1ECFF"); ctx.fillStyle=g; ctx.strokeStyle=ACC; ctx.lineWidth=2; rr(o.x,o.y,o.w,o.h,4); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(o.x,o.y+2); ctx.lineTo(o.x+o.w/2,o.y+o.h*0.6); ctx.lineTo(o.x+o.w,o.y+2); ctx.stroke(); ctx.fillStyle=BUG; ctx.font="bold 11px ui-monospace,monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("@",o.x+o.w/2,o.y+o.h*0.75); ctx.restore(); }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function draw(){ ctx.clearRect(0,0,cssW,CSSH); drawGround(); for(var i=0;i<obs.length;i++){ obs[i].type==="bug"?drawBug(obs[i]):drawEnvelope(obs[i]); } drawHero(); ctx.textAlign="center"; ctx.textBaseline="middle"; if(state==="idle"){ ctx.fillStyle=FAINT; ctx.font="600 13px ui-sans-serif,system-ui,sans-serif"; ctx.fillText("Press Space or tap to run",cssW/2,34); } else if(state==="over"){ ctx.fillStyle=flashMsg.indexOf("HIGH")>=0?ACC:INK; ctx.font="700 16px ui-sans-serif,system-ui,sans-serif"; var s=flashT>0?(0.7+0.3*Math.sin(frame*0.3)):1; ctx.globalAlpha=s; ctx.fillText(flashMsg,cssW/2,30); ctx.globalAlpha=1; } }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  resize(); requestAnimationFrame(loop);
})();
